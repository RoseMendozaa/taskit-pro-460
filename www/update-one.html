<!DOCTYPE html>
<html>
<head>
    <title>Update Task</title>

    <link rel="stylesheet" href="styles/style1.css">
    <link rel="stylesheet" href="styles/style2.css">
    <link rel="stylesheet" href="styles/style3.css">

    <script>
    let id;

    window.addEventListener("load", main);

    function main() {
        readOne();
        document.getElementById("btn").addEventListener("click", writeOne);
    }

    function readOne() {
        const params = new URLSearchParams(location.search);
        id = params.get("taskid");

        fetch("/retrieve-one/" + id)
        .then(response => response.json())
        .then(function(data) {
            document.getElementById("taskid").value = data.taskid;
            document.getElementById("taskname").value = data.taskname;
            document.getElementById("taskpriority").value = data.taskpriority;
            document.getElementById("taskdate").value = data.taskdate;
            document.getElementById("taskcategory").value = data.taskcategory;
            document.getElementById("taskdetails").value = data.taskdetails;
            document.getElementById("taskstatus").value = data.taskstatus || "Not Started";
        });
    }

    function writeOne() {
        const data = {
            taskid: document.getElementById("taskid").value,
            taskname: document.getElementById("taskname").value,
            taskpriority: document.getElementById("taskpriority").value,
            taskdate: document.getElementById("taskdate").value,
            taskcategory: document.getElementById("taskcategory").value,
            taskdetails: document.getElementById("taskdetails").value,
            taskstatus: document.getElementById("taskstatus").value
        };

        fetch("/update", {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        }).then(() => location.href = "retrieve.html");
    }
    </script>

</head>

<body>

<div class="main">

    <!-- LEFT SIDEBAR -->
    <div class="menu">
        <h1 class="myH1">TaskIT - Update Task</h1>
        <img src="images/pic3.png" class="myImg" alt="TaskIT logo"><br><br>

        <ul>
            <li><a class="myA" href="index.html">Home</a></li>
            <li><a class="myA" href="create.html">Create</a></li>
            <li><a class="myA" href="retrieve.html">View</a></li>
            <li><a class="myA" href="delete.html">Delete</a></li>
        </ul>
    </div>

    <!-- RIGHT CONTENT -->
    <div class="meat">

        <h2 class="myH2a">Edit Task Details</h2>

        <input id="taskid" style="visibility:hidden"><br>

        <span class="textp">Task Name:</span><br>
        <input id="taskname" class="blueback textw"><br><br>

        <span class="textp">Priority:</span><br>
        <select id="taskpriority" class="blueback textw">
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select><br><br>

        <span class="textp">Due Date:</span><br>
        <input id="taskdate" type="date" class="blueback textw"><br><br>

        <span class="textp">Category:</span><br>
        <select id="taskcategory" class="blueback textw">
            <option value="Personal">Personal</option>
            <option value="Academic">Academic</option>
            <option value="Professional">Professional</option>
        </select><br><br>

        <span class="textp">Details:</span><br>
        <textarea id="taskdetails" class="blueback textw" rows="4"></textarea><br><br>

        <span class="textp">Task Status:</span><br>
        <select id="taskstatus" class="blueback textw">
            <option value="Not Started">Not Started</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
        </select><br><br>

        <input type="button" id="btn" value="UPDATE TASK" class="textp">

    </div>

</div>

</body>
</html>
