<!DOCTYPE html>
<html>
<head>
    <title>Delete Tasks</title>

    <link rel="stylesheet" href="styles/style1.css">
    <link rel="stylesheet" href="styles/style2.css">
    <link rel="stylesheet" href="styles/style3.css">

    <script>
    window.addEventListener("load", readAll);

    function readAll() {
        fetch("http://localhost:7777/retrieve")
        .then(response => response.json())
        .then(function(data) {
            let deleteList = document.getElementById("deleteList");
            deleteList.innerHTML = "";

            if (data.length === 0) {
                deleteList.innerHTML = `<div class="textp"><b>No tasks found.</b></div>`;
                return;
            }

            data.forEach(row =>
                deleteList.innerHTML += `
                    <div class="textp">
                        <a class="myA" href="delete-one.html?taskid=${row.taskid}">
                            DELETE ${row.taskid}
                        </a>
                        — <b>${row.taskname}</b> |
                        ${row.taskpriority} |
                        ${row.taskdate} |
                        ${row.taskcategory} |
                        ${row.taskstatus || "Not Started"} |
                        ${row.taskdetails}
                    </div>
                    <br>
                `
            );
        });
    }
    </script>
</head>

<body>

<div class="main">

    <!-- LEFT SIDEBAR -->
    <div class="menu">
        <h1 class="myH1">TaskIT - Delete Tasks</h1>
        <img src="images/pic2.png" class="myImg" alt="TaskIT logo"><br><br>

        <ul>
            <li><a class="myA" href="index.html">Home</a></li>
            <li><a class="myA" href="create.html">Create</a></li>
            <li><a class="myA" href="retrieve.html">View</a></li>
            <li><a class="myA" href="update.html">Update</a></li>
        </ul>
    </div>

    <!-- RIGHT CONTENT -->
    <div class="meat">
        <h2 class="myH2a">Delete a Task</h2>
        <p class="textp">Click a task below to delete it permanently.</p>
        <br>
        <div id="deleteList"></div>
    </div>

</div>

</body>
</html>
