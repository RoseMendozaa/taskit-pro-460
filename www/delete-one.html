<!DOCTYPE html>
<html>
<head>
    <title>Delete Task</title>
    
    <link rel="stylesheet" href="styles/style1.css">
    <link rel="stylesheet" href="styles/style2.css">
    <link rel="stylesheet" href="styles/style3.css">

    <script>
    let taskid;

    window.addEventListener("load", loadTask);

    function loadTask() {
        const params = new URLSearchParams(location.search);
        taskid = params.get("taskid");

        fetch("http://localhost:7777/retrieve-one/" + taskid)
            .then(response => response.json())
            .then(data => {
                document.getElementById("taskInfo").innerHTML = `
                    <div class="textp">
                        <b>ID:</b> ${data.taskid}<br><br>
                        <b>Name:</b> ${data.taskname}<br><br>
                        <b>Priority:</b> ${data.taskpriority}<br><br>
                        <b>Date:</b> ${data.taskdate}<br><br>
                        <b>Category:</b> ${data.taskcategory}<br><br>
                        <b>Status:</b> ${data.taskstatus || "Not Started"}<br><br>
                        <b>Details:</b> ${data.taskdetails}<br><br>
                    </div>
                `;
            });
    }

    function deleteTask() {
        fetch("http://localhost:7777/delete/" + taskid, { method: "DELETE" })
            .then(() => location.href = "retrieve.html");
    }
    </script>
</head>

<body>

<div class="main">

    <!-- LEFT SIDEBAR -->
    <div class="menu">
        <h1 class="myH1">TaskIT - Delete One</h1>
        <img src="images/pic2.png" class="myImg" alt="TaskIT logo"><br><br>

        <ul>
            <li><a class="myA" href="index.html">Home</a></li>
            <li><a class="myA" href="create.html">Create</a></li>
            <li><a class="myA" href="retrieve.html">View</a></li>
            <li><a class="myA" href="delete.html">Delete List</a></li>
        </ul>
    </div>

    <!-- RIGHT CONTENT -->
    <div class="meat">
        <h2 class="myH2a">Confirm Delete</h2>
        <p class="textp">Make sure this is the correct task before deleting it.</p>
        <br>

        <div id="taskInfo"></div>

        <br><br>

        <button onclick="deleteTask()" class="textp">
            DELETE THIS TASK
        </button>
    </div>

</div>

</body>
</html>
